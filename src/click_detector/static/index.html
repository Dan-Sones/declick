<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef1ed">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("declick-theme");
        const dark = saved === "dark" || (!saved && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#121212" : "#eef1ed";
      } catch {}
    })();
  </script>
  <title>Declick · Audio inspector</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%232b6250'/%3E%3Cpath d='M8 20h6l3-10 5 20 3-10h7' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body data-view="home">
  <div id="root"></div>
</body>
</html>
